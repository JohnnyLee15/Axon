[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"


[project]
name = "axon-ai-agent"
version = "0.1.2"
description = "An extensible terminal AI agent for research, knowledge retrieval, and software development."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"

dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.5.3",
    "peft==0.18.1",
    "huggingface-hub>=1.11,<2",

    "docling==2.86.0",
    "docling-core==2.73.0",
    "docling-ibm-models==3.13.0",
    "docling-parse==5.8.0",
    "pysbd>=0.3.4,<0.4",

    "sqlite-vec>=0.1.9,<0.2",
    "datasketch>=1.9,<2",
    "xxhash>=3.6,<4",
    "numpy>=2.4,<3",

    "rich>=14.3,<15",
    "prompt-toolkit>=3.0.52,<4",
    "blessed>=1.48,<2",
    "google-genai>=2.10,<3",
    "pylatexenc>=2.10,<3",
    "python-dotenv>=1.2,<2",

    "mlx>=0.31,<0.32; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.31,<0.32; platform_system == 'Darwin' and platform_machine == 'arm64'",
]


[project.urls]
Repository = "https://github.com/JohnnyLee15/Axon"


[project.scripts]
axon = "axon.__main__:main"


[tool.setuptools.packages.find]
where = ["src"]
include = ["axon*"]
